[project]
name = "legacy-code-documentation"
version = "0.1.0"
description = "Fine-tuning de LLM para documentação de código legado em português"
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legacy_doc*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
