project:
  seed: 42
  output_dir: models/qwen3-legacy-doc-qlora

data:
  dataset_name: google/code_x_glue_ct_code_to_text
  codexglue_languages: [python, php, javascript]
  target_languages: [python, php, javascript, sql]
  sql_dataset_path: dataset/sql
  max_train_samples_per_language: 10000
  max_validation_samples_per_language: 1000
  max_test_samples_per_language: 1000
  min_code_chars: 40
  max_code_chars: 12000
  normalized_dir: dataset/processed/codexglue
  curated_dir: dataset/curated
  sft_dir: dataset/processed/sft

model:
  name: Qwen/Qwen3-1.7B
  max_length: 2048
  load_in_4bit: true
  trust_remote_code: false

training:
  num_train_epochs: 1
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  warmup_ratio: 0.03
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 2
  gradient_checkpointing: true
  bf16: true
  fp16: false
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

generation:
  max_new_tokens: 1600
  temperature: 0.2
  top_p: 0.9
  enable_thinking: true
