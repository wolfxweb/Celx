# Treino LoRA no Mac (MPS/CPU). Sem bitsandbytes / QLoRA.
# Monitore com: tensorboard --logdir outputs/training/runs

project:
  seed: 42
  output_dir: models/qwen3-legacy-doc-lora-local

data:
  dataset_name: google/code_x_glue_ct_code_to_text
  codexglue_languages: [python, php, javascript]
  target_languages: [python, php, javascript, sql]
  sql_dataset_path: dataset/sql
  max_train_samples_per_language: 10000
  max_validation_samples_per_language: 1000
  max_test_samples_per_language: 1000
  min_code_chars: 40
  max_code_chars: 12000
  normalized_dir: dataset/processed/codexglue
  curated_dir: dataset/curated_smoke
  sft_dir: dataset/processed/sft

model:
  name: Qwen/Qwen3-1.7B
  max_length: 1024
  load_in_4bit: false
  trust_remote_code: false

training:
  num_train_epochs: 1
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  logging_steps: 1
  eval_steps: 10
  save_steps: 20
  save_total_limit: 2
  gradient_checkpointing: true
  bf16: false
  fp16: false
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  report_to: [tensorboard]
  logging_dir: outputs/training/runs
  metrics_csv: outputs/training/metrics.csv

generation:
  max_new_tokens: 1200
  temperature: 0.2
  top_p: 0.9
  enable_thinking: true
