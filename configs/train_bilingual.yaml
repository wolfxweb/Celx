# SFT bilingue: pt-BR + en (2 respostas por código quando ambos existem).
# Mac: use volumes pequenos. Nuvem: aponte normalized_dir para full_php_js_sql.

project:
  seed: 42
  output_dir: models/qwen3-legacy-doc-qlora-bilingual

data:
  dataset_name: google/code_x_glue_ct_code_to_text
  codexglue_languages: [php, javascript]
  target_languages: [php, javascript, sql]
  sql_dataset_path: dataset/sql
  max_train_samples_per_language: 1600
  max_validation_samples_per_language: 200
  max_test_samples_per_language: 200
  min_code_chars: 40
  max_code_chars: 12000
  normalized_dir: dataset/processed/full
  curated_dir: dataset/curated
  sft_dir: dataset/processed/sft_bilingual

bilingual:
  # curated_pairs = só curated (documentation_pt + documentation_en)
  # hybrid = curated + EN estruturado do CodeXGLUE (pt-BR só se curado)
  mode: curated_pairs
  doc_languages: [pt-BR, en]

model:
  name: Qwen/Qwen3-1.7B
  max_length: 1024
  load_in_4bit: true
  trust_remote_code: false

training:
  num_train_epochs: 1
  learning_rate: 0.0002
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  logging_steps: 10
  eval_strategy: "no"
  save_steps: 100
  save_total_limit: 1
  gradient_checkpointing: true
  bf16: true
  fp16: false
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  min_train_samples: 2
  logging_dir: outputs/training_bilingual/runs
  metrics_csv: outputs/training_bilingual/metrics.csv

evaluation:
  max_samples: 12
  max_new_tokens: 512
  output_dir: outputs/eval_bilingual

generation:
  max_new_tokens: 1600
  temperature: 0.2
  top_p: 0.9
  enable_thinking: true
  doc_language: pt-BR
